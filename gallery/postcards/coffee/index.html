<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coffee</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1424}#stage{width:100%;height:100%;display:flex;align-items:center;justify-content:center}canvas{image-rendering:pixelated;image-rendering:crisp-edges}#load{position:fixed;inset:0;display:grid;place-items:center;color:#efe6d2;font:11px ui-monospace;background:#0d1424}</style><link rel="stylesheet" href="../../shared/controls-theme.css"><style>#load{background:var(--pc-default-dark);color:var(--pc-default-light);font-family:var(--pc-font-mono);font-weight:400;letter-spacing:.2em}</style></head><body><div id="stage"><canvas id="c"></canvas></div><div id="load">SETTLING THE COFFEE…</div><script type="module">import{loadRenderSettings,applyRenderSelection,installRenderMessageHandler}from '../../shared/render-settings.js';window.COFFEE_VALUES=await fetch('./values.json',{cache:'no-store'}).then(response=>response.json());const settings=await loadRenderSettings();applyRenderSelection(window.COFFEE_VALUES,settings);await import('./scene.js');installRenderMessageHandler(window.__coffee,window.COFFEE_VALUES,settings);window.__coffee.boot();</script></body></html>
