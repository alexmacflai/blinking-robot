<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passing legs — controls</title>
<style>
  :root{color-scheme:dark;--bg:#0a0a0c;--ink:#e8e6df;--dim:#77746c;--line:#292a30;--accent:#c8b98a;--panel:#101014}
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;background:var(--bg);overflow:hidden}
  body{display:flex;font:11px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--dim)}

  #panel{width:320px;flex:none;height:100%;overflow-y:auto;background:var(--panel);
    border-right:1px solid var(--line);padding:16px 14px 60px}
  #panel h1{color:var(--ink);font-size:11px;letter-spacing:.18em;font-weight:500;margin:0 0 14px}
  #panel h2{color:var(--ink);font-size:10px;letter-spacing:.16em;font-weight:500;
    margin:22px 0 6px;padding-top:12px;border-top:1px solid var(--line)}
  #panel h3{color:var(--accent);font-size:10px;letter-spacing:.12em;font-weight:500;margin:14px 0 4px}
  .note{margin:0 0 10px;font-size:10px;line-height:1.5;color:#5f5d57}
  .row{display:grid;grid-template-columns:112px 1fr 46px;align-items:center;gap:6px;margin:3px 0}
  .row label{font-size:10px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .val{font-size:10px;color:var(--ink);text-align:right}
  input[type=range]{width:100%;height:14px;accent-color:var(--accent);background:transparent}
  input[type=color]{width:100%;height:20px;padding:0;border:1px solid var(--line);background:none}
  select{width:100%;background:#17171c;color:var(--ink);border:1px solid var(--line);
    font:10px ui-monospace,Menlo,monospace;padding:2px 4px}
  button{background:#17171c;color:var(--ink);border:1px solid var(--line);
    font:10px ui-monospace,Menlo,monospace;letter-spacing:.08em;padding:5px 8px;margin:4px 4px 0 0;cursor:pointer}
  button:hover{border-color:var(--accent);color:var(--accent)}
  .bar{display:flex;flex-wrap:wrap;gap:0;margin-bottom:6px}
  .readout{margin:8px 0 0;padding:8px;background:#08080a;border:1px solid var(--line);
    font:10px/1.5 ui-monospace,Menlo,monospace;color:#6f6d66;white-space:pre;overflow-x:auto}
  textarea{width:100%;margin-top:6px;background:#08080a;color:#8d8a82;border:1px solid var(--line);
    font:10px/1.4 ui-monospace,Menlo,monospace;padding:6px;resize:vertical}
  textarea.bad{border-color:#b4544a}

  /* No padding: fitCanvas() sizes the canvas from clientHeight, which INCLUDES
     padding, so any here overflows the postcard past the bottom of the page. */
  #stage{flex:1;min-width:0;height:100%;display:flex;align-items:center;justify-content:center}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
  #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:var(--bg);color:#6f6d66;letter-spacing:.2em;z-index:20}
</style>
</head>
<body>
<div id="panel"><h1>PASSING LEGS — CONTROLS</h1></div>
<div id="stage"><canvas id="c"></canvas></div>
<div id="load">WAITING ON THE FLOOR…</div>
<script>
(function(){
"use strict";

/* ========================================================================
   BLINKING ROBOT — passing legs (MAKER CONTROLS)

   Same scene, same engine, plus a live control panel. The public postcard is
   index.html and must stay free of this. Values here are session-only; SAVE
   VALUES exports the whole CFG so it can be pasted back into both surfaces.

   The camera lies on the floor, looking along it. People walk past in formal
   trousers and shoes, in four depth ranks, and never stop. Nobody arrives,
   nobody is recognised, nothing happens.

   RENDER PIPELINE — the house discipline: compose the whole scene as
   CONTINUOUS luminance in a Float32 buffer, then threshold the finished
   composite once through an ordered Bayer 8x8 matrix. One dither pass means
   every surface is quantised on the same lattice and the frame reads as a
   single screen-print rather than a stack of pre-dithered parts.

   GEOMETRY is a real one-point perspective, but only just. The camera sits at
   CAM.height above the floor with a horizontal axis, so the floor plane images
   as a single horizontal line — the horizon — and every walker at depth d is
   drawn at a uniform scale of focal/d pixels per metre. Within a rank there is
   no perspective at all; between ranks there is nothing but scale. That is the
   whole projection.

   THE FRAME DOES THE CROPPING. The focal length is not chosen for a look — it
   is solved, so that the silhouette of the FARTHEST rank still runs off the
   top edge. Below that value the far figures acquire shoulders and heads and
   the postcard becomes a picture of people. Above it, the near legs grow wider
   than the frame. If you change `cam.focal` or the rank depths, check that
   every rank's coat top is still negative.

   NO CYCLE. Unlike the windmill and the coffee, this postcard does not loop.
   Walkers are spawned at a randomised cadence, cross, and are destroyed. There
   is no period to return to and nothing accumulates, so there is nothing to
   drift. `warmup()` runs the traffic for half a minute before the first
   visible frame, or the postcard would open on an empty floor.

   RESOLUTION INDEPENDENCE — the only authored pixel quantities are `horizon`
   and `focal`, both against a BASE 234x416 grid and multiplied by S at build
   time. Everything else in CFG is in METRES and is converted by the projection,
   so the scene cannot drift out of agreement with itself at another grid size.
   ===================================================================== */

const BASE_W=234, BASE_H=416;

const CFG = {
  gridK : 26,          // grid is 9k x 16k cells -> 234x416 at k=26
  fit   : 'fill',      // 'fill' = grow into the space | 'crisp' = integer zoom
  ink   : '#101418',
  paper : '#e9e6dd',

  /* Camera. `horizon` and `focal` are base-grid pixels; `height` is metres.
     A low camera compresses every rank's shoe onto nearly the same line — the
     contact points below span about six pixels — which is the point: the floor
     is a line, not a plane, and depth has nowhere to go but scale, tone and
     cadence.

     `horizon` is the composition's one real lever, and it trades two things
     against each other. The share of the frame ABOVE it that a figure spends
     on coat rather than leg is 1 - 0.81*scale/horizon, and the number of
     figures that fit across the far rank is about 474/horizon. Lower it and
     the crowd gets denser and leggier; raise it and you get a few large
     walkers under a curtain of coats. 150 is where the legs are the subject,
     the far rank still fits five abreast, and the floor keeps the bottom of
     the frame empty. */
  cam   : { horizon:150, focal:407, height:0.09 },

  /* Depth ranks, far to near at draw time. `tone` is the silhouette's
     luminance against paper-white background: solid ink at the front, lifting
     toward the background as it recedes. This is the postcard's depth cue and
     it is applied without exception — a rank has exactly one value. */
  ranks : [
    { d:2.20, tone:0.00, gap:[3.2,7.5], right:0.85 },
    { d:2.54, tone:0.22, gap:[2.6,6.0], right:0.15 },
    { d:2.95, tone:0.42, gap:[1.8,4.2], right:0.80 },
    { d:3.39, tone:0.60, gap:[1.4,3.2], right:0.25 }
  ],

  /* Adjacent ranks walk in opposing directions on purpose. Walkers going the
     same way almost never cross, so without a counter-stream the overlap the
     scene is about would simply not occur. */

  /* The figure, in metres. `coat` is not a garment so much as the reason the
     silhouette can leave the top of the frame without being cut at the hip:
     an amputated waist reads as a mistake, a coat running off the edge reads
     as a person who is simply taller than the picture.
     `coatTop` is therefore a DRAWN EXTENT, not a body height. It is always
     off the top of the frame, so nothing is gained by keeping it anatomical
     and a great deal is lost: it sets the focal-length constraint above, and
     holding it near a real 1.5m forces a scale at which one walker is a third
     of the frame wide. Raising it is what lets the crowd be a crowd. */
  fig   : { hip:0.90, thigh:0.43, shin:0.42, ankle:0.075,
            rThigh:0.088, rKnee:0.066, rCuff:0.076,
            shoeL:0.26, shoeH:0.055,
            coatTop:3.20, coatW:0.20, coatDrop:0.12, sway:0.045,
            vary:0.06 },

  /* Gait. `step` is short and `duty` is long: this is a concourse shuffle,
     not a walk. Speed and step together fix the cadence — one full cycle is
     2*step/speed seconds — so the legs cannot skate. */
  gait  : { speed:0.52, step:0.42, duty:0.58, lift:0.085, bob:0.035, vary:0.13 },

  floor : { far:0.99, near:0.88, grain:0.016,
            shadow:0.46, shadowLen:0.75 },

  /* Separation. Two silhouettes of the SAME rank are the same value, so where
     they overlap they merge into one unreadable mass — and a walker's own two
     legs overlap on every stride. `sep` is the lighter value laid in behind a
     silhouette's edge, and `sepW` its width in pixels. See drawSep(). */
  sep   : 0.30, sepW : 1.15
};

/* ---------- helpers --------------------------------------------------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
function smooth(x){ const t=clamp(x,0,1); return t*t*(3-2*t); }

/* Deterministic noise, added to TONE only — never to the palette or the
   lattice. A smooth ramp thresholded through an ordered matrix produces long
   straight bands, which on the floor read as scan lines rather than as a
   surface. */
function grain(x,y){
  const n=Math.sin(x*12.9898+y*78.233)*43758.5453;
  return (n-Math.floor(n))-0.5;
}

/* The traffic is random but not arbitrary: one seeded stream means a given
   build always produces the same crowd, which is what makes a change to the
   gait or the ranks observable rather than lost in the noise. */
let rngState=0x9e3779b9;
function rnd(){
  rngState|=0; rngState=(rngState+0x6D2B79F5)|0;
  let t=Math.imul(rngState^(rngState>>>15),1|rngState);
  t=(t+Math.imul(t^(t>>>7),61|t))^t;
  return ((t^(t>>>14))>>>0)/4294967296;
}
const rrange=(a,b)=>a+(b-a)*rnd();

const BAYER = new Uint8Array([
   0,32, 8,40, 2,34,10,42,  48,16,56,24,50,18,58,26,
  12,44, 4,36,14,46, 6,38,  60,28,52,20,62,30,54,22,
   3,35,11,43, 1,33, 9,41,  51,19,59,27,49,17,57,25,
  15,47, 7,39,13,45, 5,37,  63,31,55,23,61,29,53,21]);

function packColor(hex){
  const n=parseInt(hex.slice(1),16);
  const r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  return ((255<<24)|(b<<16)|(g<<8)|r)>>>0;   // little-endian AABBGGRR
}

/* ======================================================================
   DERIVED STATE — rebuilt by build()
   ==================================================================== */
let W,H,S;
let lum,img,buf32,CINK,CPAP;
let HOR;                 // horizon, in grid pixels
let SEPW;                // separation width, in grid pixels
let ranks=[];            // { d, tone, sepTone, sc, halfW, gap, right, walkers, tNext }

const cv=document.getElementById('c');
const ctx=cv.getContext('2d',{alpha:false});

function build(){
  const K=CFG.gridK;
  W=9*K; H=16*K; S=W/BASE_W;

  cv.width=W; cv.height=H;
  img=ctx.createImageData(W,H);
  buf32=new Uint32Array(img.data.buffer);
  lum=new Float32Array(W*H);
  CINK=packColor(CFG.ink); CPAP=packColor(CFG.paper);

  HOR=CFG.cam.horizon*S;
  SEPW=CFG.sepW*S;

  ranks=CFG.ranks.map(r=>{
    const sc=CFG.cam.focal*S/r.d;      // pixels per metre at this depth
    return { d:r.d, tone:r.tone,
             sepTone:Math.min(0.92, r.tone+CFG.sep),
             sc:sc, halfW:(W*0.5)/sc,
             gap:r.gap, right:r.right,
             walkers:[], tNext:rrange(0,r.gap[1]) };
  });
}

/* Re-derive the rank table in place. Rebuilding it wholesale would empty the
   floor on every slider move, which makes it impossible to judge a depth or a
   tone against the crowd you were just looking at. */
function refreshRanks(){
  HOR=CFG.cam.horizon*S;
  SEPW=CFG.sepW*S;
  for(let i=0;i<CFG.ranks.length;i++){
    const r=CFG.ranks[i], R=ranks[i]; if(!R) continue;
    R.d=r.d; R.tone=r.tone; R.sepTone=Math.min(0.92,r.tone+CFG.sep);
    R.sc=CFG.cam.focal*S/r.d; R.halfW=(W*0.5)/R.sc;
    R.gap=r.gap; R.right=r.right;
  }
}

/* World -> grid. x is lateral metres from the frame's centre line, z is height
   above the floor. Both divide by depth exactly once, in `sc`. */
function pxOf(sc,x){ return W*0.5+sc*x; }
function pyOf(sc,z){ return HOR+sc*(CFG.cam.height-z); }

/* ======================================================================
   PRIMITIVES — everything writes coverage-weighted luminance
   ==================================================================== */
function span(y,xa,xb,tone,alpha){
  if(y<0||y>=H||xb<=xa) return;
  if(xa<0)xa=0; if(xb>W)xb=W; if(xb<=xa) return;
  const o=y*W, i0=Math.floor(xa), i1=Math.ceil(xb)-1;
  for(let x=i0;x<=i1;x++){
    const cov=Math.min(x+1,xb)-Math.max(x,xa); if(cov<=0) continue;
    const a=alpha*cov, i=o+x;
    lum[i]+=(tone-lum[i])*a;
  }
}
/* Shaded variant: fn(x,y) -> tone, sampled at the pixel centre. */
function spanF(y,xa,xb,fn,alpha){
  if(y<0||y>=H||xb<=xa) return;
  if(xa<0)xa=0; if(xb>W)xb=W; if(xb<=xa) return;
  const o=y*W, i0=Math.floor(xa), i1=Math.ceil(xb)-1, cy=y+0.5;
  for(let x=i0;x<=i1;x++){
    const cov=Math.min(x+1,xb)-Math.max(x,xa); if(cov<=0) continue;
    const a=alpha*cov, i=o+x;
    lum[i]+=(fn(x+0.5,cy)-lum[i])*a;
  }
}

function ellipse(cx,cy,rx,ry,tone,alpha){
  if(alpha===undefined) alpha=1;
  if(rx<=0||ry<=0) return;
  const y0=Math.max(0,Math.floor(cy-ry)), y1=Math.min(H-1,Math.ceil(cy+ry));
  for(let y=y0;y<=y1;y++){
    const u=(y+0.5-cy)/ry; if(u<=-1||u>=1) continue;
    const dx=rx*Math.sqrt(1-u*u);
    span(y,cx-dx,cx+dx,tone,alpha);
  }
}

/* Tapered capsule — the only limb primitive there is. A trouser leg is a
   capsule from hip to knee and another from knee to cuff; a dress shoe is a
   capsule from heel to toe that thins toward the toe.

   `only` is what makes same-rank separation work. When it is undefined the
   capsule simply paints. When it is a rank's tone, the capsule writes ONLY
   over pixels already at or below that tone — that is, over material of its
   own rank or nearer, and never over the background, the floor, or a farther
   rank. Painting a lighter value through that filter puts a rim exactly where
   two silhouettes of one value would otherwise have merged, and nowhere else.
   It costs no bookkeeping: the buffer already knows what is underneath. */
function capT(ax,ay,bx,by,ra,rb,tone,only){
  const rmax=Math.max(ra,rb)+1;
  const x0=Math.max(0,Math.floor(Math.min(ax,bx)-rmax));
  const x1=Math.min(W-1,Math.ceil(Math.max(ax,bx)+rmax));
  const y0=Math.max(0,Math.floor(Math.min(ay,by)-rmax));
  const y1=Math.min(H-1,Math.ceil(Math.max(ay,by)+rmax));
  const dx=bx-ax, dy=by-ay, L2=dx*dx+dy*dy||1;
  const gated=(only!==undefined), lim=gated?only+0.02:0;
  for(let y=y0;y<=y1;y++){
    const o=y*W, cy=y+0.5;
    for(let x=x0;x<=x1;x++){
      const cx=x+0.5;
      let t=((cx-ax)*dx+(cy-ay)*dy)/L2; t=clamp(t,0,1);
      const qx=cx-(ax+dx*t), qy=cy-(ay+dy*t);
      const r=ra+(rb-ra)*t;
      const cov=clamp(r+0.5-Math.sqrt(qx*qx+qy*qy),0,1); if(cov<=0) continue;
      const i=o+x;
      if(gated && lum[i]>lim) continue;
      lum[i]+=(tone-lum[i])*cov;
    }
  }
}

/* Convex quad, used for the coat column. Same gate as capT. */
function quad(pts,tone,only){
  let ymin=1e9,ymax=-1e9;
  for(const p of pts){ if(p[1]<ymin)ymin=p[1]; if(p[1]>ymax)ymax=p[1]; }
  const y0=Math.max(0,Math.floor(ymin)), y1=Math.min(H-1,Math.ceil(ymax));
  const gated=(only!==undefined), lim=gated?only+0.02:0;
  const xs=[];
  for(let y=y0;y<=y1;y++){
    const cy=y+0.5; xs.length=0;
    for(let i=0,n=pts.length;i<n;i++){
      const a=pts[i], b=pts[(i+1)%n];
      if((a[1]<=cy)===(b[1]<=cy)) continue;
      xs.push(a[0]+(cy-a[1])*(b[0]-a[0])/(b[1]-a[1]));
    }
    if(xs.length<2) continue;
    xs.sort((p,q)=>p-q);
    for(let i=0;i+1<xs.length;i+=2){
      if(!gated){ span(y,xs[i],xs[i+1],tone,1); continue; }
      let xa=Math.max(0,xs[i]), xb=Math.min(W,xs[i+1]);
      const o=y*W;
      for(let x=Math.floor(xa);x<Math.ceil(xb);x++){
        const cov=Math.min(x+1,xb)-Math.max(x,xa); if(cov<=0) continue;
        const k=o+x; if(lum[k]>lim) continue;
        lum[k]+=(tone-lum[k])*cov;
      }
    }
  }
}

/* ======================================================================
   TRAFFIC
   ==================================================================== */
function spawn(R){
  const g=CFG.gait, f=CFG.fig;
  const dir = rnd()<R.right ? 1 : -1;
  const hs  = 1+f.vary*(rnd()*2-1);
  const sp  = g.speed*(1+g.vary*(rnd()*2-1))*hs;
  R.walkers.push({
    x   : -dir*(R.halfW+0.55),
    dir : dir,
    hs  : hs,
    speed: sp,
    step : g.step*hs,
    p   : rnd()
  });
}

function stepWorld(dt){
  for(const R of ranks){
    R.tNext-=dt;
    if(R.tNext<=0){ spawn(R); R.tNext=rrange(R.gap[0],R.gap[1]); }
    for(let i=R.walkers.length-1;i>=0;i--){
      const w=R.walkers[i];
      w.x+=w.dir*w.speed*dt;
      /* One full cycle is two steps. Deriving the period from speed and step
         rather than setting it directly is what keeps the planted foot planted
         instead of skating along the floor. */
      w.p=(w.p+dt*w.speed/(2*w.step))%1;
      if(Math.abs(w.x)>R.halfW+0.7) R.walkers.splice(i,1);
    }
  }
}

/* Where a foot is, relative to the hip, at gait phase p.
   Stance carries the foot backward at exactly the walking speed — that is why
   the range is 2*duty*step and not `step` — and swing returns it, faster and
   lifted. */
function foot(p,step,duty,lift){
  const range=2*duty*step;
  if(p<duty){
    const u=p/duty;
    return { x:range*(0.5-u), z:0 };
  }
  const u=(p-duty)/(1-duty), s=smooth(u);
  return { x:range*(s-0.5), z:lift*Math.sin(Math.PI*u) };
}

/* ======================================================================
   FIGURE
   ==================================================================== */

/* Two-link solve for the knee. The knee is drawn ANTERIOR — on the side the
   walker is facing — because a leg that bends the other way stops being a leg
   and the whole rank reads as furniture. */
function knee(hx,hz,ax,az,L1,L2,dir){
  let vx=ax-hx, vz=az-hz;
  let d=Math.hypot(vx,vz);
  const dmax=L1+L2-0.004, dmin=Math.abs(L1-L2)+0.004;
  if(d>dmax){ const k=dmax/d; vx*=k; vz*=k; d=dmax; }
  if(d<dmin){ const k=dmin/(d||1e-6); vx*=k; vz*=k; d=dmin; }
  const a=(d*d+L1*L1-L2*L2)/(2*d), h=Math.sqrt(Math.max(0,L1*L1-a*a));
  const ux=vx/d, uz=vz/d;
  return { x:hx+ux*a + dir*h*(-uz), z:hz+uz*a + dir*h*(ux),
           ax:hx+vx, az:hz+vz };
}

/* One leg, hip to shoe. `only` gates every stroke, so the same function draws
   the silhouette and its separation rim. */
function drawLeg(w,sc,p,tone,only,grow){
  const f=CFG.fig, g=CFG.gait, hs=w.hs;
  const ft=foot(p,w.step,g.duty,g.lift*hs);

  /* The body is lowest at double support and highest at mid-stance. It is not
     decoration: without the drop the leg cannot reach the end of its own
     stride and the foot slips. */
  const hipZ=f.hip*hs - g.bob*hs*(0.5+0.5*Math.cos(4*Math.PI*p));
  const hipX=w.x;
  const ankX=w.x+w.dir*ft.x, ankZ=f.ankle*hs+ft.z;

  const K=knee(hipX,hipZ,ankX,ankZ,f.thigh*hs,f.shin*hs,w.dir);

  const hpx=pxOf(sc,hipX), hpy=pyOf(sc,hipZ);
  const kpx=pxOf(sc,K.x),  kpy=pyOf(sc,K.z);
  const apx=pxOf(sc,K.ax), apy=pyOf(sc,K.az);

  const rT=f.rThigh*hs*sc+grow, rK=f.rKnee*hs*sc+grow, rC=f.rCuff*hs*sc+grow;
  capT(hpx,hpy,kpx,kpy,rT,rK,tone,only);
  capT(kpx,kpy,apx,apy,rK,rC,tone,only);

  /* Shoe. The toe dips through the swing, which is the only thing that stops
     four shoes at four depths from reading as one repeated stamp. */
  const th=-w.dir*0.55*(ft.z/(g.lift*hs||1));
  const cs=Math.cos(th), sn=Math.sin(th);
  const hlx=-w.dir*f.shoeL*hs*0.30, hlz=-(f.ankle*hs-f.shoeH*hs*0.5);
  const tlx= w.dir*f.shoeL*hs*0.68, tlz=-(f.ankle*hs-f.shoeH*hs*0.40);
  const heel=[ankX+hlx*cs-hlz*sn, ankZ+hlx*sn+hlz*cs];
  const toe =[ankX+tlx*cs-tlz*sn, ankZ+tlx*sn+tlz*cs];
  capT(pxOf(sc,heel[0]),pyOf(sc,heel[1]),
       pxOf(sc,toe[0]), pyOf(sc,toe[1]),
       f.shoeH*hs*sc*0.52+grow, f.shoeH*hs*sc*0.34+grow, tone, only);
}

function drawCoat(w,sc,tone,only,grow){
  const f=CFG.fig, hs=w.hs;
  /* A slow sway at the stride frequency. It is what keeps a rank of coats
     from reading as a row of posts. */
  const sway=f.sway*Math.sin(2*Math.PI*w.p)*w.dir;
  const z0=(f.hip-f.coatDrop)*hs, z1=f.coatTop*hs;
  const hw=f.coatW*hs;
  const x0=w.x+sway*0.35, x1=w.x+sway;
  const g=grow/sc;
  quad([[pxOf(sc,x0-hw-g),pyOf(sc,z0)],
        [pxOf(sc,x0+hw+g),pyOf(sc,z0)],
        [pxOf(sc,x1+hw*1.08+g),pyOf(sc,z1)],
        [pxOf(sc,x1-hw*1.08-g),pyOf(sc,z1)]],tone,only);
}

function drawWalker(w,R){
  const sc=R.sc;
  /* Order is load-bearing. The separation pass runs first, over the whole
     figure, so it can only touch walkers of this rank already drawn; then the
     body; then a second separation pass under the near leg alone, so a
     walker's own legs stay two legs. */
  drawCoat(w,sc,R.sepTone,R.tone,SEPW);
  drawLeg(w,sc,w.p,R.sepTone,R.tone,SEPW);
  drawLeg(w,sc,(w.p+0.5)%1,R.sepTone,R.tone,SEPW);

  drawCoat(w,sc,R.tone,undefined,0);
  drawLeg(w,sc,w.p,R.tone,undefined,0);

  drawLeg(w,sc,(w.p+0.5)%1,R.sepTone,R.tone,SEPW);
  drawLeg(w,sc,(w.p+0.5)%1,R.tone,undefined,0);
}

/* ======================================================================
   GROUND
   ==================================================================== */
function floorToneAt(y){
  const u=clamp((y-HOR)/(H-HOR),0,1);
  return lerp(CFG.floor.far,CFG.floor.near,u);
}

function drawFloor(){
  const fl=CFG.floor;
  for(let y=Math.floor(HOR);y<H;y++){
    const base=floorToneAt(y+0.5);
    spanF(y,0,W,(x,cy)=>base+grain(x,cy)*fl.grain,1);
  }
}

/* The only thing that fastens a silhouette to the floor. Without it the ranks
   float and the horizon stops meaning anything. */
function drawShadows(R){
  const f=CFG.fig, g=CFG.gait, sc=R.sc, fl=CFG.floor;
  for(const w of R.walkers){
    for(let k=0;k<2;k++){
      const p=(w.p+k*0.5)%1;
      const ft=foot(p,w.step,g.duty,g.lift*w.hs);
      const x=pxOf(sc,w.x+w.dir*ft.x);
      const y=pyOf(sc,0);
      const up=clamp(1-ft.z/(g.lift*w.hs||1),0,1);
      const rx=f.shoeL*w.hs*sc*fl.shadowLen*(0.55+0.45*up);
      const ry=f.shoeH*w.hs*sc*(0.85+0.5*up);
      ellipse(x,y,rx,ry,floorToneAt(y)*fl.shadow,0.55*up+0.12);
    }
  }
}

/* ======================================================================
   DITHER + BLIT
   ==================================================================== */
function dither(){
  for(let y=0;y<H;y++){
    const row=(y&7)<<3, o=y*W;
    for(let x=0;x<W;x++){
      const i=o+x;
      buf32[i] = lum[i]*64 > BAYER[row|(x&7)]+0.5 ? CPAP : CINK;
    }
  }
  ctx.putImageData(img,0,0);
}

/* ======================================================================
   FRAME — back to front, rank by rank
   ==================================================================== */
function renderFrame(){
  lum.fill(1.0);
  drawFloor();
  for(let i=ranks.length-1;i>=0;i--){
    const R=ranks[i];
    drawShadows(R);
    for(const w of R.walkers) drawWalker(w,R);
  }
  dither();
}

/* ======================================================================
   DRIVER
   ==================================================================== */
const DT=1/60;
let acc=0,last=0,galleryPaused=false,driverActive=false,rafSeen=false;
const loadEl=document.getElementById('load');

/* There is no cycle to seek to, so the opening frame is simply the traffic
   half a minute in. Without this the postcard opens on an empty floor and
   fills up, which is a beginning — and this scene must not have one. */
function warmup(){ for(let i=0;i<30*60;i++) stepWorld(DT); }

/* The stage can measure zero for an arbitrarily long time — inside a gallery
   iframe, or a pane that has not been rendered yet — and neither `resize` nor
   ResizeObserver is guaranteed to fire when it finally has a size. So the fit
   is driven from the render loop instead of from an event, and this guard is
   what makes that cheap: everything below runs only when the stage has
   actually changed size. */
let fitW=-1, fitH=-1;
function fitCanvas(){
  const st=document.getElementById('stage');
  const availW=st.clientWidth, availH=st.clientHeight;
  if(availW===fitW && availH===fitH) return;
  fitW=availW; fitH=availH;
  let w,h;
  if(CFG.fit==='crisp'){
    const cell=Math.max(1,Math.floor(Math.min(availW/W, availH/H)));
    w=W*cell; h=H*cell;
  }else{
    h=Math.floor(Math.min(availH, availW*16/9));
    h-=h%16; if(h<16) h=16;
    w=h*9/16;
  }
  cv.style.width=w+'px'; cv.style.height=h+'px';
}

function tick(now){
  if(galleryPaused) return;
  fitCanvas();
  const n=(now===undefined)?performance.now():now;
  let dtr=(n-last)/1000; last=n;
  if(dtr>0.25) dtr=0.25;
  acc+=dtr; while(acc>=DT){ stepWorld(DT); acc-=DT; }
  renderFrame();
}
function rafLoop(now){
  if(galleryPaused){ driverActive=false; return; }
  rafSeen=true; tick(now); requestAnimationFrame(rafLoop);
}
function startDriver(){
  if(driverActive||galleryPaused) return;
  driverActive=true; last=performance.now();
  requestAnimationFrame(rafLoop);
  setTimeout(()=>{ if(!rafSeen) setInterval(()=>tick(),16); },400);
}
addEventListener('message',e=>{
  const d=e.data;
  if(!d||d.type!=='blinking-robot:preview-pause') return;
  galleryPaused=Boolean(d.paused);
  if(!galleryPaused) startDriver();
});
addEventListener('resize',fitCanvas);
/* A plain resize listener is not enough. The stage can still have zero height
   when this script first runs — inside a gallery iframe, or a pane that lays
   out after load — and fitCanvas() would then lock the postcard to 9x16 CSS
   pixels with no later resize event to rescue it. */
if(typeof ResizeObserver!=='undefined') new ResizeObserver(fitCanvas).observe(document.getElementById('stage'));

build();
warmup();
fitCanvas(); renderFrame();
loadEl.remove();
startDriver();

/* Console handle. `run(sec)` advances the traffic without drawing, which is
   how you look for a crossing rather than waiting for one. */
window.__legs={ CFG:CFG,
  run:function(sec){ for(let i=0;i<Math.round(sec*60);i++) stepWorld(DT); renderFrame(); },
  pause:function(){ galleryPaused=true; driverActive=false; },
  play:function(){ galleryPaused=false; startDriver(); },
  paused:function(){ return galleryPaused; },
  rebuild:function(){ build(); warmup(); fitCanvas(); renderFrame(); },
  refresh:function(){ refreshRanks(); renderFrame(); },
  render:renderFrame,
  fit:fitCanvas,
  clear:function(){ for(const R of ranks){ R.walkers.length=0; R.tNext=0; } },
  seed:function(v){ rngState=v|0; },
  canvas:cv,
  ranks:function(){ return ranks; },
  state:function(){ return ranks.map(R=>({d:R.d,tone:R.tone,n:R.walkers.length,
                                          x:R.walkers.map(w=>+w.x.toFixed(2))})); } };
})();
</script>
<script>
/* ========================================================================
   CONTROL PANEL

   Nothing below draws the postcard. It reads and writes CFG and then asks the
   engine to do one of three things, in increasing order of violence:

     render   — redraw the frame (tone, floor, shadow, separation)
     refresh  — re-derive the rank table in place, keeping the traffic
                (camera, depth, spawn cadence, direction)
     rebuild  — build() + warmup(), which empties and re-populates the floor
                (grid size, palette)

   Anything that changes the SIZE of the buffer has to rebuild. Anything that
   only changes where a walker is drawn can refresh. Getting this wrong is not
   a crash, it is a control that appears to do nothing until you touch another
   one, so keep the third argument of ctl() honest.
   ===================================================================== */
(function(){
"use strict";
const L=window.__legs, CFG=L.CFG;
const panel=document.getElementById('panel');

const APPLY={
  render : ()=>L.render(),
  refresh: ()=>L.refresh(),
  rebuild: ()=>L.rebuild()
};

function section(title,note){
  const s=document.createElement('section');
  s.innerHTML='<h2>'+title+'</h2>'+(note?'<p class="note">'+note+'</p>':'');
  panel.appendChild(s);
  return s;
}
function row(sec,label){
  const r=document.createElement('div'); r.className='row';
  r.innerHTML='<label>'+label+'</label>';
  sec.appendChild(r); return r;
}

/* get/set are closures over CFG so a control never has to know a path. */
function ctl(sec,label,get,set,min,max,step,apply,fmt){
  const r=row(sec,label);
  const i=document.createElement('input');
  i.type='range'; i.min=min; i.max=max; i.step=step; i.value=get();
  const v=document.createElement('span'); v.className='val';
  const show=()=>{ v.textContent=(fmt?fmt(get()):(+get()).toFixed(step<1?(step<0.02?3:2):0)); };
  show();
  i.addEventListener('input',()=>{ set(parseFloat(i.value)); show(); APPLY[apply](); });
  r.appendChild(i); r.appendChild(v);
  return { el:i, sync:()=>{ i.value=get(); show(); } };
}
function pick(sec,label,opts,get,set,apply){
  const r=row(sec,label);
  const s=document.createElement('select');
  for(const o of opts){ const e=document.createElement('option'); e.value=o; e.textContent=o; s.appendChild(e); }
  s.value=get();
  s.addEventListener('change',()=>{ set(s.value); APPLY[apply](); });
  r.appendChild(s);
  return { el:s, sync:()=>{ s.value=get(); } };
}
function swatch(sec,label,get,set,apply){
  const r=row(sec,label);
  const i=document.createElement('input');
  i.type='color'; i.value=get();
  i.addEventListener('input',()=>{ set(i.value); APPLY[apply](); });
  r.appendChild(i);
  return { el:i, sync:()=>{ i.value=get(); } };
}
function button(sec,label,fn){
  const b=document.createElement('button'); b.textContent=label;
  b.addEventListener('click',fn); sec.appendChild(b); return b;
}

const syncers=[];
const reg=c=>{ syncers.push(c); return c; };
const syncAll=()=>{ for(const c of syncers) c.sync(); readout(); };

/* ---------- pixels ---------------------------------------------------- */
{
  const s=section('PIXELS','Only 9:16 grids (9k x 16k) tile into whole internal pixels. Every postcard is portrait; the grid changes the resolution, never the shape.');
  reg(ctl(s,'grid k',()=>CFG.gridK,v=>CFG.gridK=Math.round(v),12,44,1,'rebuild',
          v=>Math.round(v)+'  ('+(9*Math.round(v))+'x'+(16*Math.round(v))+')'));
  reg(pick(s,'display fit',['fill','crisp'],()=>CFG.fit,v=>{CFG.fit=v;L.fit();},'render'));
}

/* ---------- palette --------------------------------------------------- */
{
  const s=section('PALETTE','Two tones. Everything between them is ordered dither, not colour.');
  reg(swatch(s,'ink (darkest)',()=>CFG.ink,v=>CFG.ink=v,'rebuild'));
  reg(swatch(s,'paper (brightest)',()=>CFG.paper,v=>CFG.paper=v,'rebuild'));
  button(s,'swap',()=>{ const a=CFG.ink; CFG.ink=CFG.paper; CFG.paper=a; L.rebuild(); syncAll(); });
}

/* ---------- camera ---------------------------------------------------- */
let readEl;
{
  const s=section('CAMERA','The camera lies on the floor. Horizon is the composition’s one real lever: lower it for a denser, leggier crowd, raise it for a few large walkers under a curtain of coats. Watch COAT TOP below — every rank must stay negative or that rank sprouts shoulders.');
  reg(ctl(s,'horizon (px)',()=>CFG.cam.horizon,v=>CFG.cam.horizon=v,60,300,1,'refresh'));
  reg(ctl(s,'focal (px·m)',()=>CFG.cam.focal,v=>CFG.cam.focal=v,180,900,1,'refresh'));
  reg(ctl(s,'camera height (m)',()=>CFG.cam.height,v=>CFG.cam.height=v,0.01,0.40,0.005,'refresh'));
  readEl=document.createElement('pre'); readEl.className='readout'; s.appendChild(readEl);
}

/* The derived numbers a maker actually needs, and the one invariant that can
   silently break the postcard. */
function readout(){
  if(!readEl) return;
  const S=CFG.gridK*9/234, W=9*CFG.gridK;
  const HOR=CFG.cam.horizon*S, f=CFG.fig, g=CFG.gait;
  let out='rank   px/m  across  cross   coat top\n';
  let bad=false;
  CFG.ranks.forEach((r,i)=>{
    const sc=CFG.cam.focal*S/r.d;
    const across=W/(2*f.coatW*sc);
    const cross=(W/sc+0.6)/g.speed;
    const top=HOR-sc*(f.coatTop-CFG.cam.height);
    if(top>=0) bad=true;
    out+=String(i).padEnd(5)+sc.toFixed(0).padStart(6)+across.toFixed(1).padStart(8)
       +(cross.toFixed(1)+'s').padStart(7)+top.toFixed(0).padStart(11)+(top>=0?'  <-- CUT':'')+'\n';
  });
  out+=bad?'\nA rank is cut inside the frame: raise coat top,\nlower horizon, or bring that rank nearer.'
          :'\nEvery silhouette leaves the top of the frame.';
  readEl.textContent=out;
}

/* ---------- depth ranks ----------------------------------------------- */
{
  const s=section('DEPTH RANKS','Four depths, front to back. Tone is the whole depth cue — a rank has exactly one value. Adjacent ranks are given opposing direction bias on purpose: walkers going the same way never cross.');
  CFG.ranks.forEach((r,i)=>{
    const h=document.createElement('h3');
    h.textContent='RANK '+i+(i===0?'  (front)':(i===CFG.ranks.length-1?'  (back)':''));
    s.appendChild(h);
    reg(ctl(s,'depth (m)',()=>r.d,v=>r.d=v,1.2,8.0,0.01,'refresh'));
    reg(ctl(s,'tone',()=>r.tone,v=>r.tone=v,0,0.92,0.01,'render'));
    reg(ctl(s,'gap min (s)',()=>r.gap[0],v=>r.gap[0]=v,0.3,10,0.1,'refresh'));
    reg(ctl(s,'gap max (s)',()=>r.gap[1],v=>r.gap[1]=v,0.4,16,0.1,'refresh'));
    reg(ctl(s,'walks right',()=>r.right,v=>r.right=v,0,1,0.05,'refresh'));
  });
}

/* ---------- gait ------------------------------------------------------ */
{
  const s=section('GAIT','Speed and step together fix the cadence — one cycle is 2·step/speed seconds — so a planted foot stays planted. Change them and the legs keep contact; set a period directly and they skate.');
  reg(ctl(s,'speed (m/s)',()=>CFG.gait.speed,v=>CFG.gait.speed=v,0.15,1.60,0.01,'render'));
  reg(ctl(s,'step (m)',()=>CFG.gait.step,v=>CFG.gait.step=v,0.18,0.80,0.01,'render'));
  reg(ctl(s,'stance fraction',()=>CFG.gait.duty,v=>CFG.gait.duty=v,0.50,0.75,0.01,'render'));
  reg(ctl(s,'foot lift (m)',()=>CFG.gait.lift,v=>CFG.gait.lift=v,0.01,0.25,0.005,'render'));
  reg(ctl(s,'hip drop (m)',()=>CFG.gait.bob,v=>CFG.gait.bob=v,0,0.10,0.002,'render'));
  reg(ctl(s,'speed variation',()=>CFG.gait.vary,v=>CFG.gait.vary=v,0,0.5,0.01,'refresh'));
}

/* ---------- figure ---------------------------------------------------- */
{
  const s=section('FIGURE','Metres, not pixels. Coat top is a DRAWN EXTENT, not a body height — it is always off the top of the frame, and raising it is what lets the crowd shrink.');
  const f=CFG.fig;
  reg(ctl(s,'hip height (m)',()=>f.hip,v=>f.hip=v,0.60,1.20,0.01,'render'));
  reg(ctl(s,'thigh (m)',()=>f.thigh,v=>f.thigh=v,0.25,0.60,0.01,'render'));
  reg(ctl(s,'shin (m)',()=>f.shin,v=>f.shin=v,0.25,0.60,0.01,'render'));
  reg(ctl(s,'trouser thigh (m)',()=>f.rThigh,v=>f.rThigh=v,0.04,0.16,0.002,'render'));
  reg(ctl(s,'trouser knee (m)',()=>f.rKnee,v=>f.rKnee=v,0.03,0.14,0.002,'render'));
  reg(ctl(s,'trouser cuff (m)',()=>f.rCuff,v=>f.rCuff=v,0.03,0.16,0.002,'render'));
  reg(ctl(s,'shoe length (m)',()=>f.shoeL,v=>f.shoeL=v,0.12,0.42,0.005,'render'));
  reg(ctl(s,'shoe height (m)',()=>f.shoeH,v=>f.shoeH=v,0.02,0.14,0.002,'render'));
  reg(ctl(s,'coat half width (m)',()=>f.coatW,v=>f.coatW=v,0.08,0.45,0.005,'render'));
  reg(ctl(s,'coat hem below hip (m)',()=>f.coatDrop,v=>f.coatDrop=v,0,0.45,0.005,'render'));
  reg(ctl(s,'coat top (m)',()=>f.coatTop,v=>{f.coatTop=v;readout();},1.2,6.0,0.05,'render'));
  reg(ctl(s,'coat sway (m)',()=>f.sway,v=>f.sway=v,0,0.16,0.002,'render'));
  reg(ctl(s,'height variation',()=>f.vary,v=>f.vary=v,0,0.25,0.005,'refresh'));
}

/* ---------- ground ---------------------------------------------------- */
{
  const s=section('GROUND','Keep the floor pale. A large area near mid luminance is a large area of 50% stipple, which reads as noise rather than as a surface — the shadows, not the tone, are what fasten a walker to the floor.');
  reg(ctl(s,'tone at horizon',()=>CFG.floor.far,v=>CFG.floor.far=v,0.5,1,0.005,'render'));
  reg(ctl(s,'tone at bottom',()=>CFG.floor.near,v=>CFG.floor.near=v,0.3,1,0.005,'render'));
  reg(ctl(s,'grain',()=>CFG.floor.grain,v=>CFG.floor.grain=v,0,0.12,0.002,'render'));
  reg(ctl(s,'shadow tone',()=>CFG.floor.shadow,v=>CFG.floor.shadow=v,0,1,0.01,'render'));
  reg(ctl(s,'shadow spread',()=>CFG.floor.shadowLen,v=>CFG.floor.shadowLen=v,0.2,2.5,0.05,'render'));
}

/* ---------- separation ------------------------------------------------ */
{
  const s=section('SEPARATION','Two silhouettes of the same rank are the same value, so where they overlap they merge — and a walker’s own two legs overlap on every stride. This lays a lighter value behind a silhouette’s edge, but only over material of its own rank. Take it to zero to see what it is for.');
  reg(ctl(s,'lift',()=>CFG.sep,v=>CFG.sep=v,0,0.6,0.01,'refresh'));
  reg(ctl(s,'width (px)',()=>CFG.sepW,v=>CFG.sepW=v,0,4,0.05,'refresh'));
}

/* ---------- traffic / time -------------------------------------------- */
{
  const s=section('TRAFFIC','There is no loop to seek. The crowd is a seeded stream, so a given seed always produces the same traffic — which is what makes a change to the gait observable instead of lost in the noise.');
  const bar=document.createElement('div'); bar.className='bar'; s.appendChild(bar);
  const pauseBtn=button(bar,'pause',()=>{
    if(L.paused()){ L.play(); pauseBtn.textContent='pause'; }
    else { L.pause(); pauseBtn.textContent='play'; }
  });
  button(bar,'+1s',()=>L.run(1));
  button(bar,'+10s',()=>L.run(10));
  button(bar,'clear floor',()=>{ L.clear(); L.render(); });
  button(bar,'re-seed',()=>{ L.seed((Math.random()*4294967296)|0); L.rebuild(); });
}

/* ---------- export ---------------------------------------------------- */
{
  const s=section('EXPORT','SAVE VALUES is the whole CFG. Paste it back into the CFG literal in BOTH index.html and controls.html — they are deliberately separate copies.');
  const bar=document.createElement('div'); bar.className='bar'; s.appendChild(bar);

  button(bar,'save PNG',()=>{
    L.canvas.toBlob(b=>{
      const a=document.createElement('a');
      a.href=URL.createObjectURL(b);
      a.download='passing-legs-'+(9*CFG.gridK)+'x'+(16*CFG.gridK)+'.png';
      a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    });
  });
  button(bar,'save values',()=>{
    const blob=new Blob([dump()],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download='passing-legs.json';
    a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  });
  button(bar,'copy',()=>{
    ta.value=dump(); ta.select();
    if(navigator.clipboard) navigator.clipboard.writeText(ta.value);
  });
  button(bar,'apply',()=>{
    let v; try{ v=JSON.parse(ta.value); }catch(e){ ta.classList.add('bad'); return; }
    ta.classList.remove('bad');
    merge(CFG,v); L.rebuild(); syncAll();
  });

  const ta=document.createElement('textarea');
  ta.spellcheck=false; ta.rows=12; ta.value='';
  s.appendChild(ta);

  function dump(){ return JSON.stringify(CFG,null,2); }
  /* Merge rather than replace, so an older or partial export still applies
     and a key added since it was saved keeps its current value. */
  function merge(dst,src){
    for(const k in src){
      if(!(k in dst)) { dst[k]=src[k]; continue; }
      const a=dst[k], b=src[k];
      if(Array.isArray(a)&&Array.isArray(b)){
        for(let i=0;i<b.length;i++){
          if(a[i]&&typeof a[i]==='object'&&typeof b[i]==='object') merge(a[i],b[i]);
          else a[i]=b[i];
        }
      } else if(a&&typeof a==='object'&&b&&typeof b==='object') merge(a,b);
      else dst[k]=b;
    }
  }
  window.addEventListener('keydown',e=>{
    if(e.key==='v'&&(e.metaKey||e.ctrlKey)&&document.activeElement!==ta) return;
  });
  const refresh=()=>{ if(document.activeElement!==ta) ta.value=dump(); };
  setInterval(refresh,1200); refresh();
}

readout();
})();

</script>
</body>
</html>
