<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cloud-drain warning sign</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101418}#stage{width:100%;height:100%;display:grid;place-items:center}canvas{image-rendering:pixelated;image-rendering:crisp-edges}#load{position:fixed;inset:0;display:grid;place-items:center;background:#101418;color:#e9e6dd;font:11px ui-monospace}</style><link rel="stylesheet" href="../../shared/controls-theme.css"><style>#load{background:var(--pc-default-dark);color:var(--pc-default-light);font-family:var(--pc-font-mono);font-weight:400;letter-spacing:.2em}</style></head><body><div id="stage"><canvas id="c"></canvas></div><div id="load">OPENING THE DRAIN…</div><script type="module">import{loadRenderSettings,applyRenderSelection,installRenderMessageHandler}from '../../shared/render-settings.js';window.DRAIN_VALUES=await fetch('./values.json',{cache:'no-store'}).then(response=>response.json());const settings=await loadRenderSettings();applyRenderSelection(window.DRAIN_VALUES,settings);await import('./scene.js');installRenderMessageHandler(window.__drain,window.DRAIN_VALUES,settings);</script></body></html>
