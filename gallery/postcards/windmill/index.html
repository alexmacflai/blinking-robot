<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Windmill</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101014}#stage{width:100%;height:100%;display:flex;align-items:center;justify-content:center}canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#101014;color:#efece2;font:11px ui-monospace,monospace;letter-spacing:.2em}</style></head><body><div id="stage"><canvas id="c"></canvas></div><div id="load">SETTLING THE AIR…</div><script type="module">import {createWindmillScene}from './scene.js';import{loadRenderSettings,applyRenderSelection,installRenderMessageHandler}from '../../shared/render-settings.js';const [values,settings]=await Promise.all([fetch('./values.json',{cache:'no-store'}).then(r=>r.json()),loadRenderSettings()]);applyRenderSelection(values,settings);const scene=createWindmillScene({canvas:document.querySelector('#c'),stage:document.querySelector('#stage'),loadEl:document.querySelector('#load'),config:values});installRenderMessageHandler(scene,scene.config,settings);scene.start();</script></body></html>
