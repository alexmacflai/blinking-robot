<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blinking Robot — postcards</title>
  <style>
    :root { color-scheme: dark; --bg:#0a0a0c; --ink:#e8e6df; --dim:#77746c; --line:#292a30; --accent:#c8b98a; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--dim); font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace; padding:clamp(24px,6vw,80px); }
    main { max-width:760px; margin:auto; }
    h1 { color:var(--ink); font-size:clamp(18px,3vw,28px); letter-spacing:.16em; font-weight:500; margin:0; }
    p { max-width:620px; }
    .intro { margin:8px 0 48px; color:var(--dim); }
    ul { list-style:none; padding:0; margin:0; border-top:1px solid var(--line); }
    li { border-bottom:1px solid var(--line); }
    a { display:block; padding:18px 0; color:var(--ink); text-decoration:none; }
    a:hover { color:var(--accent); }
    small { display:block; color:var(--dim); margin-top:3px; }
  </style>
</head>
<body>
  <main>
    <h1>BLINKING ROBOT</h1>
    <p class="intro">Coded animation postcards: small worlds where something keeps moving.</p>
    <ul>
      <li><a href="postcards/windmill/index.html">Windmill <small>procedural 1-bit postcard · open animation</small></a></li>
    </ul>
  </main>
</body>
</html>
