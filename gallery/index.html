<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blinking Robot — postcards</title>
  <style>
    :root { color-scheme:dark; --bg:#0a0a0c; --ink:#e8e6df; --dim:#77746c; --line:#292a30; --accent:#c8b98a; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--dim); font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace; padding:clamp(24px,6vw,80px); }
    main { max-width:1120px; margin:auto; }
    h1 { color:var(--ink); font-size:clamp(18px,3vw,28px); letter-spacing:.16em; font-weight:500; margin:0; }
    .intro { max-width:620px; margin:8px 0 48px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr)); gap:clamp(20px,3vw,36px); }
    .card { min-width:0; }
    .preview { aspect-ratio:9 / 16; background:#111116; border:1px solid var(--line); overflow:hidden; }
    iframe { width:100%; height:100%; display:block; border:0; pointer-events:none; }
    .card h2 { margin:12px 0 2px; font-size:13px; font-weight:500; letter-spacing:.08em; }
    .card a { color:var(--ink); text-decoration:none; }
    .card a:hover { color:var(--accent); }
    .card p { margin:0; font-size:11px; color:var(--dim); }
    @media (min-width:980px) { .grid { grid-template-columns:repeat(3,minmax(0,1fr)); } }
  </style>
</head>
<body>
  <main>
    <h1>BLINKING ROBOT</h1>
    <p class="intro">Coded animation postcards: small worlds where something keeps moving.</p>
    <section class="grid" id="gallery" aria-label="Postcards"></section>
  </main>
  <script>
    const POSTCARDS = [
      { title:'Windmill', description:'procedural 1-bit postcard', src:'postcards/windmill/index.html' },
      { title:'Coffee', description:'procedural 1-bit postcard', src:'postcards/coffee/index.html' }
    ];
    const gallery = document.getElementById('gallery');
    for (const postcard of POSTCARDS) {
      const card = document.createElement('article');
      card.className = 'card';
      card.innerHTML = `<div class="preview"><iframe title="${postcard.title} preview" src="${postcard.src}" loading="lazy" tabindex="-1"></iframe></div><h2><a href="${postcard.src}">${postcard.title}</a></h2><p>${postcard.description} · <a href="${postcard.src}">open animation</a></p>`;
      gallery.appendChild(card);
    }
    const observer = new IntersectionObserver(entries => {
      for (const entry of entries) {
        const frame = entry.target.querySelector('iframe');
        frame.contentWindow?.postMessage({ type:'blinking-robot:preview-pause', paused:!entry.isIntersecting }, '*');
      }
    }, { rootMargin:'50% 0px' });
    document.querySelectorAll('.card').forEach(card => observer.observe(card));
  </script>
</body>
</html>
